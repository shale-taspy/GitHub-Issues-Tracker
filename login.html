<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub Issues Tracker login</title>
	<!--Tailwind CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<!--Header-->
<div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
  <div class="text-center mb-8">
  <div class="inline-flex items-center justify-center mb-3">
  <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-16 h-16 object-contain">
  </div>
  <h1 class="text-2xl font-bold text-gray-800">GitHub Issues Tracker</h1>
  <p class="text-sm text-gray-500 mt-1">Sign in to manage your issues</p>
  </div>
	<!--Error-->
	<div id="error-alert" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center font-medium">
    Invalid username or password!
  </div>
	<!--Login-->
	<form id="loginForm" class="space-y-4">
      <!--Username-->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Enter Username" 
          required 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base text-gray-700 placeholder-gray-400"
        >
        
      </div>
      <!--Password-->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter Password" 
          required 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-gray-700 placeholder-gray-400"
        >
        <div class="text-center mt-4 text-base">
          <p class=" text-indigo-600 mt-1 font-medium">Default: admin</p>
        <p class=" text-indigo-600 mt-1 font-medium">Default: admin123</p>
        </div>
      </div>
      <!--Submit-->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-2 text-sm cursor-pointer"
      >
        Login
      </button>
  </form>
	<!--Script-->
	<script type="module" src="index.js"></script>
</body>
</html>
