<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub Issues Tracker login</title>
	<!--Tailwind CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<!--Header-->
<div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
  <div class="text-center mb-8">
  <div class="inline-flex items-center justify-center mb-3">
  <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-16 h-16 object-contain">
  </div>
  <h1 class="text-2xl font-bold text-gray-800">GitHub Issues Tracker</h1>
  <p class="text-sm text-gray-500 mt-1">Sign in to manage your issues</p>
  </div>
	<!--Error-->
	<div id="error-alert" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center font-medium">
    Invalid username or password!
  </div>
</body>
</html>
