<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub Issues Tracker</title>
	<!--Tailwind CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
	<!--Nav-->
	<header class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8 object-contain">
      <h1 class="text-xl font-bold text-gray-800">GitHub Issues Tracker</h1>
    </div>
    <!--search logout and new issues-->
    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="relative flex-1 md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search issues..." 
          class="w-full pl-3 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50"
        >
      </div>
      <button id="newIssueBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New Issue
      </button>
      <button id="logoutBtn" class="bg-gray-100 hover:bg-red-50 text-gray-700 hover:text-red-600 border border-gray-300 hover:border-red-300 text-sm font-medium px-3 py-2 rounded-lg flex items-center gap-2 transition cursor-pointer whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out preview-icon"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg> Logout
      </button>
    </div>
  </header>
  <!--Main-->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <!--filter-->
    <div class="bg-white p-2 rounded-xl border border-gray-200 flex items-center gap-2 max-w-md">
      <button data-tab="all" class="tab-btn active flex-1 py-2 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer">All</button>
      <button data-tab="open" class="tab-btn flex-1 py-2 rounded-lg text-sm font-medium transition text-gray-600 hover:bg-gray-100 cursor-pointer">Open</button>
      <button data-tab="closed" class="tab-btn flex-1 py-2 rounded-lg text-sm font-medium transition text-gray-600 hover:bg-gray-100 cursor-pointer">Closed</button>
    </div>
    <!--main content-->
    <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-xs space-y-6">
      <!--Issues-->
    <div class="flex items-center justify-between pb-4 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
            <img src="./assets/Aperture.png" alt="Aperture" class="w-5 h-5 object-contain">
          </div>
          <div>
            <h2 id="issueCount" class="text-lg font-bold text-gray-800">0 issues</h2>
            <p class="text-xs text-gray-500">Track and manage your project issues</p>
          </div>
        </div>
    </div>
    <!--spinner-->
      <div id="loadingSpinner" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-sm text-gray-500 mt-2">Loading issues...</p>
      </div>
      <!--issuesCard-->
      <div id="issuesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 hidden"></div>
      <!--empty-->
      <div id="noIssues" class="hidden text-center py-12 text-gray-500 text-sm">
        No issues found matching your criteria.
      </div>
      <!--Issue modal-->
  <div id="issueModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 relative">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-gray-100">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Issue Title</h3>
        <button id="closeModal" class="text-gray-400 hover:text-gray-600 p-1 cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>
  <!--new issue-->
  <div id="newIssueModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 relative">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-800">Create New Issue</h3>
        <button id="closeNewIssueModal" class="text-gray-400 hover:text-gray-600 p-1 cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="newIssueForm" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Title *</label>
          <input type="text" id="issueTitle" placeholder="Enter issue title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Description *</label>
          <textarea id="issueDescription" rows="3" placeholder="Enter issue description" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Author *</label>
            <input type="text" id="issueAuthor" placeholder="Enter author name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Assignee</label>
            <input type="text" id="issueAssignee" placeholder="Enter assignee name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Status *</label>
            <select id="issueStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Priority *</label>
            <select id="issuePriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Labels (comma-separated)</label>
          <input type="text" id="issueLabels" placeholder="e.g., bug, enhancement" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
          <button type="button" id="cancelNewIssue" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-check text-xs"></i> Create Issue
          </button>
        </div>
      </form>
    </div>
  </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
